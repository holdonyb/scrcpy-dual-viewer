name: Build downloadable releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python packaging/prepare_tools.py
      - name: Test source
        shell: pwsh
        run: |
          $env:PATH = "$pwd/build/vendor/ffmpeg;$env:PATH"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Source discovery also exercises the downloaded portable scrcpy.
          New-Item -ItemType Directory -Force scrcpy | Out-Null
          Copy-Item -Path build/vendor/scrcpy/* -Destination scrcpy -Recurse
          python -m unittest discover -s tests -v *> dist/tests-windows.txt
          Get-Content dist/tests-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable EXE and installer
        run: python packaging/build_release.py
      - name: Test portable and installed executable
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist/release/*-x64.exe).FullName
          $report = Join-Path $pwd 'dist/release/smoke-windows.json'
          $process = Start-Process -FilePath $portable -ArgumentList @('--self-test', "`"$report`"") -Wait -PassThru -WindowStyle Hidden
          Get-Content $report
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $installer = (Get-ChildItem dist/release/*-Setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'MultiScreenRecorder-installed'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $installedReport = Join-Path $pwd 'dist/release/smoke-windows-installed.json'
          $test = Start-Process -FilePath (Join-Path $installDir 'MultiScreenRecorder.exe') -ArgumentList @('--self-test', "`"$installedReport`"") -Wait -PassThru -WindowStyle Hidden
          Get-Content $installedReport
          $testExit = $test.ExitCode
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { exit $uninstall.ExitCode }
          if ($testExit -ne 0) { exit $testExit }
          Copy-Item dist/tests-windows.txt dist/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release
          path: |
            dist/release/*
            dist/tests-windows.txt
          compression-level: 0
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: xcb
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-sync1 libxcb-xinput0 libegl1 libgl1 libdbus-1-3 libfontconfig1 libpulse0 libasound2
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python packaging/prepare_tools.py
      - name: Test source
        run: |
          export PATH="$PWD/build/vendor/ffmpeg:$PATH"
          mkdir -p dist scrcpy fonts
          cp -a build/vendor/scrcpy/. scrcpy/
          cp -a build/vendor/fonts/. fonts/
          xvfb-run -a python -m unittest discover -s tests -v > dist/tests-linux.txt 2>&1 || { cat dist/tests-linux.txt; exit 1; }
          cat dist/tests-linux.txt
      - run: python packaging/build_release.py
      - name: Test extracted release
        run: |
          mkdir -p build/extracted-release
          tar -xzf dist/release/*-linux-x64.tar.gz -C build/extracted-release
          xvfb-run -a build/extracted-release/MultiScreenRecorder/MultiScreenRecorder --self-test "$PWD/dist/release/smoke-linux.json" || { cat dist/release/smoke-linux.json; exit 1; }
          cat dist/release/smoke-linux.json
          cp dist/tests-linux.txt dist/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-release
          path: |
            dist/release/*
            dist/tests-linux.txt
          compression-level: 0
          retention-days: 14
